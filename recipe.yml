name: Vanilla with Singularity Desktop # Replace this name with your image name
id: vanillaos-singularity # Replace this ID with your image ID
vibversion: 1.0.7

stages:
- id: build
  base: ghcr.io/vanilla-os/core:latest # Optionally, Replace this image URL with a different one i.e. gnome-nvidia:latest, etc
  addincludes: true
  singlelayer: false
  labels:
    maintainer: domesya # Optionally, Replace this with your name
  args:
    DEBIAN_FRONTEND: noninteractive # Set the image environment as non-interactive

  # Commands to run first before building the modules
  runs:
    commands:
      - echo 'APT::Install-Recommends "1";' > /etc/apt/apt.conf.d/01norecommends

  modules:
  - name: init-setup
    type: shell
    commands:
    - lpkg --unlock
    - apt-get update

  # Singularity Desktop - build from source (master, full suite, /opt/singularity, GDM kept, GNOME removed)

  - name: modules
    type: includes
    includes:
      - modules/10-singularity-build-deps.yml
      - modules/20-singularity-runtime-deps.yml
      - modules/23-remove-gnome.yml
      - modules/30-singularity-vetro.yml
      - modules/40-singularity-build.yml
      - modules/50-singularity-session.yml
      - modules/50-install-debs.yml
      - modules/80-set-image-abroot-config.yml

  - name: cleanup
    type: shell
    commands:
    - apt-get autoremove -y
    - apt-get clean
    - lpkg --lock

  - name: cleanup2
    type: shell
    commands:
      - rm -rf /tmp/*
      - rm -rf /var/tmp/*
