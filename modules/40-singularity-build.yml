name: singularity-build
type: shell
commands:
  - git clone --depth 1 --branch master --recurse-submodules https://github.com/singularityos-lab/singularity-desktop.git /tmp/singularity-desktop
  - meson setup /tmp/singularity-desktop/build /tmp/singularity-desktop --prefix=/opt/singularity --libdir=lib --buildtype=release -Dinstaller=false -Dgestures=disabled
  - meson compile -C /tmp/singularity-desktop/build
  - DESTDIR=/ meson install -C /tmp/singularity-desktop/build
  - meson setup /tmp/singularity-desktop/subprojects/labwc/build /tmp/singularity-desktop/subprojects/labwc --prefix=/opt/singularity --libdir=lib --buildtype=release -Dxwayland=enabled --force-fallback-for=wlroots-0.20
  - meson compile -C /tmp/singularity-desktop/subprojects/labwc/build
  - DESTDIR=/ meson install -C /tmp/singularity-desktop/subprojects/labwc/build
  - glib-compile-schemas /opt/singularity/share/glib-2.0/schemas 
  - glib-compile-schemas /usr/share/glib-2.0/schemas
  - rm -rf /tmp/singularity-desktop
  - ls -lh /opt/singularity/bin/singularity-labwc-session /opt/singularity/bin/singularity-session 
  - ldd /opt/singularity/bin/singularity-labwc-session 
