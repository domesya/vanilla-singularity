name: singularity-vetro
type: shell
commands:
  - curl --fail --location --output /usr/local/bin/vetro https://github.com/singularityos-lab/vetro/releases/download/v1.0.0/vetro-linux-amd64
  - echo "b653a4b1b75a31a8a00a5d12b11eaafa3f22d6cf2b3417efde68a113b4c60700  /usr/local/bin/vetro" | sha256sum --check -
  - chmod 0755 /usr/local/bin/vetro
  - /usr/local/bin/vetro --help | head -n 5
