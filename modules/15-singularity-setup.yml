name: singularity-setup
type: shell
sources:
  - type: git
    url: https://github.com/singularityos-lab/singularity-desktop.git
    branch: master
    commit: df5e873ab71dad37f0422976d231a6f2f467c124   
commands:
  - cd /sources/singularity-setup/singularity-desktop
  - git submodule update --init --recursive
  - meson setup build --prefix=/usr -Dapps=core -Dinstaller=false
  - ninja -C build
  - ninja -C build install
  - meson setup subprojects/labwc/build subprojects/labwc --prefix=/usr --libdir=lib --buildtype=release -Dxwayland=enabled --force-fallback-for=wlroots
  - ninja -C subprojects/labwc/build
  - ninja -C subprojects/labwc/build install
cleanup:
  - /usr/bin/vetro
